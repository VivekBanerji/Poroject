<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Shop - Product Card</title>
	<style>
		body {
			font-family: Arial, Helvetica, sans-serif;
			background: #fff;
			color: #222;
		}

		.product-card {
			border: 1px solid #ccc;
			background-color: #f7f7fb;
			padding: 30px; 
			margin: 40px;  
			max-width: 360px;
			box-shadow: 0 2px 6px rgba(0,0,0,0.06);
			border-radius: 8px;
		}

		.product-card h2 {
			margin: 0 0 16px 0; 
			font-size: 1.25rem;
		}

		.product-card p {
			margin: 0 0 20px 0; 
			line-height: 1.4;
			color: #444;
		}

		.buy-btn {
			display: inline-block;
			padding: 10px 18px;
			background: #0078d4;
			color: #fff;
			text-decoration: none;
			border-radius: 6px;
			border: none;
			cursor: pointer;
			font-weight: 600;
		}

		.buy-btn:hover { background: #005ea6; }
	</style>
</head>
<body>

	<div class="product-card">
		<h2>Classic Leather Wallet</h2>
		<p>Premium full-grain leather wallet with multiple card slots and a slim profile for everyday carry.</p>
		<button class="buy-btn">Buy Now</button>
	</div>

</body>
</html>
