<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout Practice</title>

    <link rel="stylesheet" href="/approach to layouts/layout.css">
</head>

<body>

<div class="wrapper">

    <!-- Header -->
    <header class="header">

        <div class="logo"></div>

        <nav class="nav">
            <div class="nav-item"></div>
            <div class="nav-item"></div>
            <div class="nav-item"></div>
        </nav>

    </header>

    <!-- Main -->
    <main>

        <div class="layout">

            <!-- Left -->
            <section class="main-content">

                <div class="hero"></div>

                <div class="small-columns">

                    <div class="small-card"></div>

                    <div class="small-card"></div>

                </div>

            </section>

            <!-- Sidebar -->
            <aside class="sidebar">

                <div class="side-title"></div>

                <div class="side-box"></div>

                <div class="side-box"></div>

                <div class="side-box"></div>

                <div class="side-box"></div>

            </aside>

        </div>

        <!-- Bottom Cards -->

        <section class="three-columns">

            <div class="card">

                <div class="square"></div>

                <div class="content">

                    <div class="line title"></div>

                    <div class="line"></div>

                    <div class="line short"></div>

                </div>

            </div>

            <div class="card">

                <div class="square"></div>

                <div class="content">

                    <div class="line title"></div>

                    <div class="line"></div>

                    <div class="line short"></div>

                </div>

            </div>

            <div class="card">

                <div class="square"></div>

                <div class="content">

                    <div class="line title"></div>

                    <div class="line"></div>

                    <div class="line short"></div>

                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->

    <footer class="footer">

        <div class="footer-box"></div>

    </footer>

</div>

</body>
</html>
