<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position Demo</title>

<style>
    body{
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    h1{
        text-align: center;
        background: #333;
        color: white;
        padding: 15px;
        margin: 0;
    }

    .section{
        border: 2px solid #ddd;
        margin: 20px;
        padding: 20px;
        height: 150px;
        position: relative;
    }

    .static-box{
        position: static;
        background: lightblue;
        padding: 10px;
    }

    .relative-box{
        position: relative;
        top: 20px;
        left: 30px;
        background: lightgreen;
        padding: 10px;
        width: 150px;
    }

    .absolute-box{
        position: absolute;
        top: 20px;
        right: 20px;
        background: orange;
        padding: 10px;
    }

    .fixed-box{
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: red;
        color: white;
        padding: 10px;
    }

    .sticky-box{
    position: sticky;
    top: 0;
    background: purple;
    color: white;
    padding: 10px;
    z-index: 1000;
}

    .content{
        height: 400px;
        padding: 20px;
    }
</style>
</head>
<body>

<h1>CSS Position Property</h1>

<div class="sticky-box">
    Sticky Navigation Bar
</div>

<div class="section">
    <h3>Static Position</h3>
    <div class="static-box">
       STATIC 
    </div>
</div>

<div class="section">
    <h3>Relative Position</h3>
    <div class="relative-box">
        Relative Position
    </div>
</div>

<div class="section">
    <h3>Absolute Position</h3>
    <div class="absolute-box">
      ABSOLUTE
    </div>
</div>

<div class="content">
    <h3> Sticky Navigation</h3>
    <p>
        The Sticky bar stay at the top and the Fixed button stay at the bottom-right corner.
    </p>
</div>

<div class="fixed-box">
    Fixed Button
</div>

</body>
</html>
