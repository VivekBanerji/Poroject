<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h2>Student Registration Form</h2>
    <form id="regForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" placeholder="Enter full name" />
        <div id="nameErr" class="error"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Enter email" />
        <div id="emailErr" class="error"></div>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="text" placeholder="10 digit phone number" maxlength="10" />
        <div id="phoneErr" class="error"></div>
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input id="age" name="age" type="number" placeholder="18 - 60" min="0" />
        <div id="ageErr" class="error"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="inline">
          <input id="password" name="password" type="password" placeholder="At least 6 characters" />
          <label class="show-pass"><input id="togglePass" type="checkbox" /> Show</label>
        </div>
        <div id="passErr" class="error"></div>
      </div>

      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input id="confirm" name="confirm" type="password" placeholder="Re-enter password" />
        <div id="confirmErr" class="error"></div>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <div>
          <label style="margin-left:12px"><input type="radio" name="gender" value="Male" /> Male</label>
          <label style="margin-left:12px"><input type="radio" name="gender" value="Female" /> Female</label>
          <label style="margin-left:12px"><input type="radio" name="gender" value="Other" /> Other</label>
        </div>
        <div id="genderErr" class="error"></div>
      </div>

      <div class="form-group">
        <label for="course">Course</label>
        <select id="course" name="course">
          <option value="">-- Select Course --</option>
          <option>Web Development</option>
          <option>Data Science</option>
          <option>UI/UX Design</option>
          <option>Mobile Development</option>
        </select>
        <div id="courseErr" class="error"></div>
      </div>

      <div class="form-group">
        <label><input id="terms" type="checkbox" /> I accept the Terms & Conditions</label>
        <div id="termsErr" class="error"></div>
      </div>

      <div class="actions">
        <div id="result" class="success"></div>
        <button id="submitBtn" type="submit" disabled>Submit</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>

</html>
