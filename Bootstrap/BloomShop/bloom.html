<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .product-card {
            border-radius: 20px;
            overflow: hidden;
            transition: .3s;
            position: relative;
        }

        .product-card img {
            width: 100%;
            height: 450px;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, .5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: .3s;
        }

        .product-card:hover .overlay {
            opacity: 1;
        }

        .quick-btn {
            background: #f8a100;
            border: none;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 600;
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 700;
            color: #f8a100;
        }

        .search-box {
            max-width: 500px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                BLOOM<span class="text-warning">SHOP</span>
            </a>

            <a href="#" class="nav-link">Contact</a>

            <form class="mx-auto search-box w-50">
                <input class="form-control rounded-pill" type="search" placeholder="Search products...">
            </form>

            <div class="d-flex gap-3 align-items-center">
                <i class="bi bi-cart3 fs-4"></i>
                <a href="#" class="text-dark text-decoration-none">Sign In</a>
                <button class="btn btn-warning rounded-pill">
                    Sign Up
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="py-5 text-center">
        <div class="container">
            <h1 class="hero-title">Step Into Style</h1>

            <p class="lead">
                Discover our latest collection of premium sneakers
                <br>
                comfort, design, and performance in every pair.
            </p>
        </div>
    </section>

    <!-- Products -->
    <section class="pb-5">
        <div class="container">
            <div class="row g-4">

                <div class="col-md-4">
                    <div class="card product-card border-0 shadow-sm">
                        <img src="https://images.unsplash.com/photo-1579338559194-a162d19bf842?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                            alt="">

                        <div class="overlay">
                            <button class="quick-btn">
                                Quick View
                            </button>
                        </div>
                    </div>

                    <h5 class="mt-3">Urban Street Pro</h5>
                </div>

                <div class="col-md-4">
                    <div class="card product-card border-0 shadow-sm">
                        <img src="https://images.unsplash.com/photo-1608667508764-33cf0726b13a?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                            alt="">
                        <div class="overlay">
                            <button class="quick-btn">
                                Quick View
                            </button>
                        </div>
                    </div>


                    <h5 class="mt-3">Urban Street Pro</h5>
                </div>

                <div class="col-md-4">
                    <div class="card product-card border-0 shadow-sm">
                        <img src="https://images.unsplash.com/photo-1465453869711-7e174808ace9?q=80&w=1176&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                            alt="">
                        <div class="overlay">
                            <button class="quick-btn">
                                Quick View
                            </button>
                        </div>
                    </div>

                    <h5 class="mt-3">Classic Court 90s</h5>
                </div>

            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
